<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font: 12.5px -apple-system, BlinkMacSystemFont, sans-serif; color: #e0e0f0; -webkit-user-select: none; cursor: default; }
  #rows { margin: 12px; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border-radius: 10px; background: rgba(35,32,26,0.97); border: 1px solid rgba(224,184,96,0.55); box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
  .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,0.06); }
  .icon { color: #e0b860; display: inline-flex; flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .text { flex: 1; min-width: 0; }
  .line { line-height: 1.35; overflow-wrap: anywhere; }
  .line b { font-weight: 600; }
  .count { margin-left: 4px; padding: 0 5px; border-radius: 8px; background: rgba(224,184,96,0.18); color: #e0b860; font-size: 11px; }
  .why { margin-top: 2px; line-height: 1.35; color: #d8d0bc; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why i { font-style: normal; color: #e0b860; }
  .cmd { margin-top: 2px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #a0a0b8; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div id="rows"></div>
<script>
  const LOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  window.accessPanel.onRows((rows) => {
    const box = document.getElementById('rows');
    box.replaceChildren(...rows.map((r) => {
      const row = el('div', 'row');
      const icon = el('span', 'icon');
      icon.innerHTML = LOCK;
      const text = el('div', 'text');
      const line = el('div', 'line');
      line.append(el('b', null, r.title), ` ${r.asks}`);
      if (r.count > 1) line.append(el('span', 'count', `×${r.count}`));
      text.append(line);
      if (r.why) { const why = el('div', 'why'); why.append(el('i', null, 'Why: '), r.why); text.append(why); }
      if (r.command) { const cmd = el('div', 'cmd', `via: ${r.command}`); cmd.title = r.command; text.append(cmd); }
      row.append(icon, text);
      return row;
    }));
    // The window takes the height the wrapped rows need.
    requestAnimationFrame(() => window.accessPanel.resize(box.getBoundingClientRect().height + 24));
  });
</script>
</body>
</html>
