<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switchboard</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="whats-new.css">
  <script>
    // The window is frameless and the native controls overlay the app's own headers,
    // which have to inset around them: left on macOS, right on Windows/Linux. Set
    // here rather than in app.js so the inset is in place for the first paint;
    // applying it later reflows the whole chrome in front of the user.
    document.documentElement.classList.add('platform-' + (window.api ? window.api.platform : 'unknown'));
  </script>
</head>
<body>
  <div id="app-container">
  <div id="sidebar">
    <button id="sidebar-expand-btn" title="Show sidebar"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M18 3a3 3 0 0 1 2.995 2.824l.005 .176v12a3 3 0 0 1 -2.824 2.995l-.176 .005h-12a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-12a3 3 0 0 1 2.824 -2.995l.176 -.005h12zm-3 2h-9a1 1 0 0 0 -.993 .883l-.007 .117v12a1 1 0 0 0 .883 .993l.117 .007h9v-14zm-5.387 4.21l.094 .083l2 2a1 1 0 0 1 .083 1.32l-.083 .094l-2 2a1 1 0 0 1 -1.497 -1.32l.083 -.094l1.292 -1.293l-1.292 -1.293a1 1 0 0 1 -.083 -1.32l.083 -.094a1 1 0 0 1 1.32 -.083z"></path></svg></button>
    <div id="sidebar-rail"></div>
    <div id="sidebar-header">
      <div id="sidebar-toolbar">
        <button id="sleep-toggle-btn" type="button" hidden></button>
        <button id="global-settings-btn" type="button" title="Global settings"></button>
        <button id="sidebar-collapse-btn" title="Hide sidebar"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M18 3a3 3 0 0 1 2.995 2.824l.005 .176v12a3 3 0 0 1 -2.824 2.995l-.176 .005h-12a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-12a3 3 0 0 1 2.824 -2.995l.176 -.005h12zm0 2h-9v14h9a1 1 0 0 0 .993 -.883l.007 -.117v-12a1 1 0 0 0 -.883 -.993l-.117 -.007zm-2.293 4.293a1 1 0 0 1 .083 1.32l-.083 .094l-1.292 1.293l1.292 1.293a1 1 0 0 1 .083 1.32l-.083 .094a1 1 0 0 1 -1.32 .083l-.094 -.083l-2 -2a1 1 0 0 1 -.083 -1.32l.083 -.094l2 -2a1 1 0 0 1 1.414 0z"></path></svg></button>
      </div>
      <div id="sidebar-tabs">
        <button class="sidebar-tab" data-tab="projects" title="Projects: work grouped into projects and tracks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></button>
        <button class="sidebar-tab active" data-tab="sessions" title="Sessions: every CLI session in the sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="m8 10 2 2-2 2"/><path d="M13 14h3"/></svg></button>
        <button class="sidebar-tab" data-tab="github" title="GitHub: your pull requests and the ones waiting for your review"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg></button>
        <button class="sidebar-tab" data-tab="todo" title="Todo: your todo list from Notion, linked to the plans"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1"/><path d="m4.5 16 1.5 1.5 3-3"/><path d="M13 7h8"/><path d="M13 16h8"/></svg></button>
        <button class="sidebar-tab" data-tab="helpscout" title="Help Scout: the support inbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6"/><path d="m14.8 14.8 3.6 3.6"/><path d="m14.8 9.2 3.6-3.6"/><path d="m5.6 18.4 3.6-3.6"/></svg></button>
        <button class="sidebar-tab" data-tab="grafana" title="Grafana: alerts, dashboards and logs of production"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg></button>
        <button style="display:none" class="sidebar-tab" data-tab="plans" title="Plans"><svg width="18" height="18" viewBox="0 0 17 17" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M14 2v-2h-13v17h13v-2h2v-13h-2zM2 16v-15h2v15h-2zM13 16h-8v-15h8v15zM15 14h-1v-3h1v3zM15 10h-1v-3h1v3zM14 6v-3h1v3h-1zM6 4h5v1h-5v-1zM6 6h4v1h-4v-1z"/></svg></button>
        <button style="display:none" class="sidebar-tab" data-tab="memory" title="Agent Files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg></button>
        <button style="display:none" class="sidebar-tab" data-tab="stats" title="Stats"><svg width="18" height="18" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M128 496H48V304h80zm224 0h-80V208h80zm112 0h-80V96h80zm-224 0h-80V16h80z"/></svg></button>
        <button class="sidebar-tab" id="sidebar-more-btn" title="More: plans, agent files, stats, settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div>
      <div id="session-filters">
        <button id="running-toggle" title="Filter: show running sessions only"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="4"/></svg></button>
        <button id="star-toggle" title="Filter: show starred sessions only"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M9.828.722a.5.5 0 0 1 .354.146l4.95 4.95a.5.5 0 0 1-.707.707c-.28-.28-.576-.49-.888-.656L10.073 9.333l-.07 3.181a.5.5 0 0 1-.853.354l-3.535-3.536-4.243 4.243a.5.5 0 1 1-.707-.707l4.243-4.243L1.372 5.11a.5.5 0 0 1 .354-.854l3.18-.07L8.37.722A3.37 3.37 0 0 1 9.12.074a.5.5 0 0 1 .708.002l-.707.707z"/></svg></button>
        <button id="today-toggle" title="Filter: show sessions active today only"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-12z"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/><path d="M11 15h1"/><path d="M12 15v3"/></svg></button>
        <button id="archive-toggle" title="Filter: include archived sessions"></button>
        <span id="loading-status" style="display:none;"></span>
        <button id="resort-btn" title="Re-sort: order groups and sessions by latest activity"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
        <button id="add-project-btn" title="Add folder: pick a folder to start sessions in"><svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor" stroke="currentColor" stroke-width="0"><path d="M512 416c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96C0 60.7 28.7 32 64 32l128 0c20.1 0 39.1 9.5 51.2 25.6l19.2 25.6c6 8.1 15.5 12.8 25.6 12.8l160 0c35.3 0 64 28.7 64 64l0 256zM232 376c0 13.3 10.7 24 24 24s24-10.7 24-24l0-64 64 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-64 0 0-64c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 64-64 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l64 0 0 64z"/></svg></button>
      </div>
    </div>
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Search sessions..." />
      <button id="search-clear" type="button" aria-label="Clear search">&times;</button>
      <button id="search-titles-toggle" type="button" title="Search titles only" aria-label="Search titles only">Tt</button>
    </div>
    <div id="sidebar-content"></div>
    <div id="projects-content" style="display:none;"></div>
    <div id="plans-content" style="display:none;"></div>
    <div id="stats-content" style="display:none;">
      <div class="plans-empty">Click the Stats tab to view activity heatmap.</div>
    </div>
    <div id="memory-content" style="display:none;"></div>
    <div id="github-content" style="display:none;"></div>
    <div id="todo-content" style="display:none;"></div>
    <div id="helpscout-content" style="display:none;"></div>
    <div id="grafana-content" style="display:none;"></div>
    <div id="sidebar-footer">
      <div id="sidebar-footer-status"><span id="sidebar-footer-activity"></span><span id="sidebar-footer-updater"></span></div>
      <div id="sidebar-footer-quota" style="display:none;"></div>
    </div>
  </div>
  <div id="sidebar-resize-handle"></div>
  <div id="main">
    <div id="placeholder">
      <p>Select a session from the sidebar to begin.</p>
    </div>
    <div id="stats-viewer" style="display:none;">
      <div id="stats-viewer-header">
        <span id="stats-viewer-title">Activity</span>
      </div>
      <div id="stats-viewer-body"></div>
    </div>
    <div id="memory-viewer" style="display:none;"></div>
    <div id="plan-viewer" style="display:none;"></div>
    <div id="project-viewer" style="display:none;"></div>
    <div id="github-viewer" style="display:none;"></div>
    <div id="todo-viewer" style="display:none;"></div>
    <div id="helpscout-viewer" style="display:none;"></div>
    <div id="grafana-viewer" style="display:none;"></div>
    <div id="project-strip" style="display:none;"></div>
    <div id="pane-resize-handle" title="Drag to resize"></div>
      <div id="project-panes" style="display:none;"></div>
    <div id="settings-viewer" style="display:none;">
      <div id="settings-viewer-header">
        <span id="settings-viewer-title">Settings</span>
      </div>
      <div id="settings-viewer-body"></div>
    </div>
    <div id="jsonl-viewer" style="display:none;">
      <div id="jsonl-viewer-header">
        <span id="jsonl-viewer-title">Message History</span>
        <span id="jsonl-viewer-session-id"></span>
      </div>
      <div id="jsonl-viewer-body"></div>
    </div>
    <div id="terminal-area">
      <div id="terminal-header" style="display:none;">
        <div id="terminal-header-info">
          <span id="terminal-header-name"></span>
          <span id="terminal-header-pty-title" style="display:none;"></span>
          <span id="terminal-header-id"></span>
          <span id="terminal-header-shell" style="display:none;"></span>
        </div>
        <div id="terminal-header-controls">
          <button id="terminal-header-ticket" type="button" style="display:none;"></button>
          <span id="terminal-header-status"></span>
          <button id="terminal-restart-task-btn" title="Restart task" style="display:none;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg></button>
          <button id="terminal-stop-btn" title="Stop process"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
        </div>
      </div>
      <div id="grid-viewer" style="display:none;">
        <div id="grid-viewer-header">
          <span id="grid-viewer-title">Session Overview</span>
          <span id="grid-viewer-count"></span>
        </div>
      </div>
      <div id="terminals"></div>
    </div>
  </div>
  </div><!-- /app-container -->
  <div id="update-toast" class="hidden">
    <span id="update-toast-msg">Update ready — restart to apply</span>
    <button id="update-restart-btn">Restart</button>
    <button id="update-dismiss-btn">Later</button>
  </div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-search/lib/addon-search.js"></script>
  <script src="../node_modules/@xterm/addon-unicode-graphemes/lib/addon-unicode-graphemes.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="../node_modules/morphdom/dist/morphdom-umd.js"></script>
  <script src="codemirror-bundle.js"></script>
  <script src="icons.js"></script>
  <script src="viewer-toolbar.js"></script>
  <script src="jsonc-parser-bundle.js"></script>
  <script src="json-reader.js"></script>
  <script src="viewer-panel.js"></script>
  <script src="file-actions.js"></script>
  <script src="file-panel.js"></script>
  <script src="settings-panel.js"></script>
  <script src="session-config.js"></script>
  <script src="session-config-form.js"></script>
  <script src="utils.js"></script>
  <script src="terminal-themes.js"></script>
  <script src="terminal-links.js"></script>
  <script src="terminal-manager.js"></script>
  <script src="task-runner.js"></script>
  <script src="grid-view.js"></script>
  <script src="stats-view.js"></script>
  <script src="message-search.js"></script>
  <script src="jsonl-viewer.js"></script>
  <script src="dialogs.js"></script>
  <script src="session-groups.js"></script>
  <script src="sidebar.js"></script>
  <script src="plan-parser.js"></script>
  <script src="snooze.js"></script>
  <script src="schedule-time.js"></script>
  <script src="schedules.js"></script>
  <script src="projects-view.js"></script>
  <script src="project-git-view.js"></script>
  <script src="project-github-view.js"></script>
  <script src="project-github-review.js"></script>
  <script src="github-phases.js"></script>
  <script src="github-releases.js"></script>
  <script src="github-my-review.js"></script>
  <script src="github-deps.js"></script>
  <script src="project-github-source.js"></script>
  <script src="github-wayfinder.js"></script>
  <script src="github-view.js"></script>
  <script src="todo-view.js"></script>
  <script src="helpscout-view.js"></script>
  <script src="grafana-view.js"></script>
  <script src="sidebar-rail.js"></script>
  <script src="plans-memory-view.js"></script>
  <script src="sidebar-keyboard.js"></script>
  <script src="sleep-toggle.js"></script>
  <script src="app.js"></script>
  <script src="whats-new.js"></script>
</body>
</html>
